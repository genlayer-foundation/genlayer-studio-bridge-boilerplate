[package]
name = "bridge-endpoint"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "bridge_endpoint"

[features]
default = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
solana-keccak-hasher = "2.2.1"
solana-sha256-hasher = "2.3.0"

[dev-dependencies]
serde_json = "1"
